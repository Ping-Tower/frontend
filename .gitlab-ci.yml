stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

build_image:
  stage: build
  image: docker:27.5.0
  services:
    - docker:27.5.0-dind
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_DEPTH: 1
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - docker buildx create --use --driver docker-container --driver-opt network=host
    - docker buildx build --pull --provenance=false --sbom=false
        --build-arg VITE_API_URL="$VITE_API_URL"
        --build-arg VITE_TELEGRAM_BOT_USERNAME="$VITE_TELEGRAM_BOT_USERNAME"
        --build-arg VITE_SOCIAL_TELEGRAM_URL="$VITE_SOCIAL_TELEGRAM_URL"
        --build-arg VITE_SOCIAL_GITHUB_URL="$VITE_SOCIAL_GITHUB_URL"
        --build-arg VITE_SOCIAL_GITLAB_URL="$VITE_SOCIAL_GITLAB_URL"
        --build-arg VITE_SOCIAL_LINKEDIN_URL="$VITE_SOCIAL_LINKEDIN_URL"
        --cache-from type=registry,ref=$CI_REGISTRY_IMAGE:buildcache
        --cache-to type=registry,ref=$CI_REGISTRY_IMAGE:buildcache,mode=max
        -t $DOCKER_IMAGE_NAME --push .
  # VITE_* настраиваются в CI/CD Variables проекта.
  # VITE_API_URL должен оставаться пустым: nginx проксирует /api/* и /hubs/* на api —
  # иначе SPA ломает cookie/HTTP-only авторизацию. Пустое значениеVariables не задаётся.

deploy:
  stage: deploy
  needs: [build_image]
  image:
    name: alpine/kubectl:1.37.1
    entrypoint: [""]
  tags: [saas-linux-small-amd64]
  resource_group: pingtower-production
  environment:
    name: production
    url: https://pingtower.tech
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
  allow_failure: false
  manual_confirmation: "Развернуть фронт PingTower в production?"
  timeout: 25m
  script:
    - kubectl config use-context pingtower/infra:pingtower
    - sed -i "s/REPLACE_WITH_COMMIT_SHA/$CI_COMMIT_SHA/g" k8s/kustomization.yaml
    - kubectl apply --dry-run=server -k k8s/
    # gitlab-registry — владелец pingtower-infra.
    - kubectl -n pingtower wait --for=condition=Ready externalsecret/gitlab-registry --timeout=120s
    - kubectl -n pingtower get secret gitlab-registry -o name
    - kubectl -n pingtower apply -f k8s/service.yaml -f k8s/ingress.yaml
    - kubectl -n pingtower wait --for=create certificate/frontend-tls --timeout=60s
    - kubectl -n pingtower wait --for=condition=Ready certificate/frontend-tls --timeout=600s
    - kubectl apply -k k8s/
    - kubectl -n pingtower rollout status deployment/frontend --timeout=600s
