apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: pingtower
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: gitlab-registry
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: frontend
                topologyKey: kubernetes.io/hostname
      containers:
        - name: frontend
          image: registry.gitlab.com/pingtower/frontend:REPLACE_WITH_COMMIT_SHA
          ports:
            - name: http
              containerPort: 80
          # nginx шаблон заменяет ${BACKEND_URL} через envsubst на старте:
          # /api/* и /hubs/* проксируются на api внутри namespace.
          env:
            # Service api: порт 80 → containerPort 8080 (name: http).
            - name: BACKEND_URL
              value: http://api:80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
